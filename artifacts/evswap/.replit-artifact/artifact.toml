kind = "web"
previewPath = "/"
title = "EVswap - Battery Swapping Network"
version = "1.0.0"
id = "artifacts/evswap"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24140
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/evswap run dev"

[services.env]
PORT = "24140"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/evswap", "run", "build"]
publicDir = "artifacts/evswap/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
